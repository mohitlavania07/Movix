name: React CI CD

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      deploy_environment:
        description: "Select the environment to deploy"
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging

jobs:

  # =========================================================
  # BUILD
  # =========================================================

  build:
    name: Build React Application
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Verify build
        run: |
          set -e

          test -d dist

          echo "React build completed successfully."


  # =========================================================
  # DYNAMIC DEPLOYMENT
  # =========================================================

  deploy:
    name: Deploy Application
    needs: build

    runs-on: ubuntu-latest

    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_environment || 'staging' }}

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show deployment target
        run: |
          echo "======================================"
          echo "Deployment Started"
          echo "======================================"
          echo "Environment: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_environment || 'staging' }}"
          echo "Commit: $GITHUB_SHA"
          echo "Branch: $GITHUB_REF_NAME"
          echo "======================================"

      - name: Deploy application
        run: |
          echo "Deploying React application..."

          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.deploy_environment || 'staging' }}" = "staging" ]; then

            echo "Deploying to STAGING"
            echo "Staging deployment commands will run here."

          elif [ "${{ github.event_name == 'workflow_dispatch' && inputs.deploy_environment || 'staging' }}" = "production" ]; then

            echo "Deploying to PRODUCTION"
            echo "Production deployment commands will run here."

          else

            echo "Invalid deployment environment."
            exit 1

          fi

      - name: Restart Nginx
        run: |
          echo "Nginx restart command will run here."

      - name: Deployment completed
        run: |
          echo "======================================"
          echo "Deployment completed successfully."
          echo "======================================"
