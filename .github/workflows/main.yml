name: React CI CD

on:

  # ---------------------------------------------------------
  # Automatic staging deployment
  # -------------------------------------------------

  push:
    branches:
      - main

  # ---------------------------------------------------------
  # Manual production deployment
  # ---------------------------------------------------------

  workflow_dispatch:
    inputs:
      deployment_target:
        description: "Select deployment environment"
        required: true
        type: choice
        options:
          - production
        default: production


jobs:

  # =========================================================
  # BUILD
  # =========================================================

  build:
    name: Build React Application

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Verify build
        run: |
          set -e

          test -d dist

          echo "React build completed successfully."


  # =========================================================
  # STAGING
  # Runs ONLY when code is pushed to main
  # =========================================================

  staging:
    name: Staging Deployment

    if: github.event_name == 'push'

    needs:
      - build

    runs-on: ubuntu-latest

    environment:
      name: Staging

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Staging deployment started
        run: |
          echo "======================================"
          echo "Staging deployment approved."
          echo "======================================"

      - name: Deploy to Staging
        run: |
          echo "Deploying React application to STAGING."

          # Actual staging deployment will go here.

      - name: Staging deployment completed
        run: |
          echo "======================================"
          echo "Staging deployment completed."
          echo "======================================"


  # =========================================================
  # PRODUCTION
  # Runs ONLY when manually triggered
  # =========================================================

  production:
    name: Production Deployment

    if: github.event_name == 'workflow_dispatch'

    needs:
      - build

    runs-on: ubuntu-latest

    environment:
      name: Production

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Production deployment started
        run: |
          echo "======================================"
          echo "Production deployment approved."
          echo "======================================"

      - name: Deploy to Production
        run: |
          echo "Deploying React application to PRODUCTION."

          # Actual production deployment will go here.

      - name: Restart Nginx
        run: |
          echo "Nginx restart command will run here."

          # Later:
          # sudo systemctl restart nginx

      - name: Production deployment completed
        run: |
          echo "======================================"
          echo "Production deployment completed."
          echo "======================================"
