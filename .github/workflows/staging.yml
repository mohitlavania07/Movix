name: React Build and Staging

on:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:

  build:
    name: Build React Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --watchAll=false --ci

      - name: Build application
        run: npm run build

      - name: Verify build
        run: |
          test -d dist
          echo "React build completed successfully."

      - name: Package build
        run: |
          tar -czf react-build-${GITHUB_SHA}.tar.gz dist/

      - name: Upload immutable artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-build-${{ github.sha }}
          path: react-build-${{ github.sha }}.tar.gz
          retention-days: 30


  staging:
    name: Staging Deployment
    needs: build

    runs-on: ubuntu-latest

    environment:
      name: staging

    steps:

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: react-build-${{ github.sha }}

      - name: Verify artifact
        run: |
          ls -lh
          test -f react-build-${GITHUB_SHA}.tar.gz

      - name: Extract artifact
        run: |
          mkdir deploy
          tar -xzf react-build-${GITHUB_SHA}.tar.gz -C deploy

      - name: Deploy to Staging
        run: |
          echo "Deploying commit ${GITHUB_SHA} to STAGING"
          echo "Artifact: react-build-${GITHUB_SHA}.tar.gz"

          # Later on self-hosted runner:
          #
          # sudo rm -rf /var/www/staging/*
          # sudo cp -r deploy/dist/* /var/www/staging/

      - name: Staging health check
        run: |
          echo "Staging health check will run here."

          # Later:
          # curl --fail https://staging.example.com

      - name: Deployment summary
        run: |
          echo "## Staging Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit SHA: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact: \`react-build-${GITHUB_SHA}.tar.gz\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Workflow Run ID: \`${GITHUB_RUN_ID}\`" >> "$GITHUB_STEP_SUMMARY"
